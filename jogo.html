<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advocatus Online</title>
<script>
// Aplica o tema salvo antes do CSS carregar, pra não piscar dark→light.
(function(){
  try {
    if (localStorage.getItem('advocatus-tema') === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  } catch(e) {}
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,600;0,700;1,400;1,600&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ════════ TOPBAR ════════ -->
<header class="topbar">
  <!-- Hamburger — só aparece no mobile -->
  <button class="hamburger" id="hamburger" onclick="toggleSidebar()" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
  <div class="logo">Advocatus<em>Online</em></div>

  <!-- Navegação unificada no nav-lateral (sidebar esquerda) — o menu superior
       redundante (Perfil/Escritório/Ranking/Social/Loja) foi removido pra
       seguir o mockup dossiê, que usa só um lugar pra navegar, não dois. -->
  <div class="topbar-spacer"></div>

  <!-- Relógio global -->
  <div class="server-clock">
    <span id="server-data" class="data-jogo">—</span>
    <span id="server-tick" class="tick">—</span>
  </div>

  <!-- Tema claro/escuro -->
  <button class="btn-tema" id="btn-tema" onclick="window._alternarTema()" title="Alternar tema claro/escuro">🌙</button>

  <!-- Avançar mês — igual mockup, botão primário fica no topbar -->
  <button class="btn-avancar" id="btn-avancar-topo" onclick="window.avancarMes()">▸ Avançar mês</button>

  <!-- Usuário -->
  <div class="topbar-user">
    <div id="tb-serasa" class="topbar-serasa"></div>
    <img id="tb-avatar" class="topbar-avatar" src="" alt="" style="display:none">
    <span id="tb-avatar-svg" class="topbar-avatar" style="display:none;border-radius:50%;overflow:hidden"></span>
    <span id="tb-nome" class="topbar-nome">—</span>
    <button class="btn-logout" onclick="fazerLogout()">Sair</button>
  </div>
</header>

<!-- ════════ LAYOUT PRINCIPAL ════════ -->
<div class="layout">

  <!-- ══ SIDEBAR ESQUERDA ══ -->
  <aside class="sidebar-left">
    <div class="perfil-header">
      <!-- Brasão SVG gerado dinamicamente por ui-main.js -->
      <div class="brasao-wrap" id="brasao-container"></div>
      <div class="perfil-nome"  id="sl-nome">—</div>
      <div class="perfil-cargo" id="sl-cargo">—</div>
      <div class="perfil-rep-bar">
        <div class="perfil-rep-fill" id="sl-rep-fill" style="width:30%"></div>
      </div>
      <div class="perfil-rep-txt">
        <span id="sl-rep-val">Rep 30</span>
        <span id="sl-rep-cap">Cap 35</span>
      </div>
    </div>

    <!-- Nav lateral — populado dinamicamente por ui-main.js conforme a categoria ativa -->
    <nav class="nav-lateral" id="nav-lateral-dynamic"></nav>

  </aside>

  <!-- ══ ÁREA CENTRAL ══ -->
  <main class="main-content" id="main-content">
    <!-- Conteúdo injetado por ui-main.js -->
    <div class="loading-inicial">
      <div class="spinner-ring"></div>
      <div>Carregando...</div>
    </div>
  </main>

  <!-- ══ SIDEBAR DIREITA ══ -->
  <aside class="sidebar-right">

    <!-- Cronologia do Jogo (substitui o calendário tradicional — o jogo trabalha por meses) -->
    <div class="cronologia-bloco">
      <div class="cronologia-label">Cronologia do Jogo</div>
      <div class="cronologia-data" id="cron-data">—</div>
      <div class="cronologia-grid" id="cron-grid">
        <!-- 12 meses injetados por gamestate.js -->
      </div>
      <div class="cronologia-sep"></div>
      <div class="cronologia-prox">
        Próximo mês em<br>
        <b id="cron-countdown">—</b>
      </div>
    </div>

    <!-- Progresso do Ano -->
    <div class="progresso-ano-bloco">
      <div class="pa-titulo">Progresso do Ano</div>
      <div class="pa-ano" id="pa-ano">Ano —</div>
      <div class="pa-mes" id="pa-mes">Mês — de 12</div>
      <div class="pa-bar-wrap">
        <div class="pa-bar-fill" id="pa-bar-fill" style="width:0%"></div>
      </div>
      <div class="pa-pct" id="pa-pct">0% concluído</div>
    </div>

    <!-- Botão Avançar Mês (injetado por avancar_mes.js) -->
    <div class="energia-bloco" id="bloco-energia">
      <button id="btn-avancar" class="btn btn-prim btn-block" onclick="window.avancarMes()">
        ▶ Avançar mês
      </button>
    </div>

    <!-- Evento global -->
    <div class="evento-bloco" id="sr-evento" style="display:none">
      <div class="evento-label" id="sr-evento-label"></div>
      <div class="evento-titulo" id="sr-evento-titulo">—</div>
      <div class="evento-desc"  id="sr-evento-desc">—</div>
    </div>

    <!-- Performance anual -->
    <div style="margin-bottom:1rem">
      <div class="bloco-titulo" id="bt-performance-anual"></div>
      <div style="font-size:.72rem;color:var(--ardosia2);line-height:1.9">
        <div style="display:flex;justify-content:space-between">
          <span>Vitórias</span>
          <span id="sr-wins-ano" style="color:var(--verde3);font-weight:600">0</span>
        </div>
        <div style="display:flex;justify-content:space-between">
          <span>Derrotas</span>
          <span id="sr-losses-ano" style="color:var(--verm3)">0</span>
        </div>
        <div style="display:flex;justify-content:space-between">
          <span>Aproveitamento</span>
          <span id="sr-aprov-ano" style="color:var(--ouro2);font-weight:600">—</span>
        </div>
        <div style="display:flex;justify-content:space-between">
          <span>Bônus esperado</span>
          <span id="sr-bonus" style="color:var(--verde3)">—</span>
        </div>
      </div>
    </div>

    <!-- Mini ranking -->
    <div class="ranking-mini" id="sr-ranking">
      <div class="bloco-titulo" id="bt-top-reputacao"></div>
      <div id="sr-ranking-lista">
        <div style="font-size:.7rem;color:var(--ardosia)">Carregando...</div>
      </div>
    </div>

  </aside>
</div>

<!-- ════════ SIDEBAR OVERLAY (mobile) ════════ -->
<div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

<!-- ════════ BOTTOM NAV (mobile) ════════ -->
<nav class="bottom-nav" id="bottom-nav">
  <div class="bnav-item ativo" id="bn-perfil" onclick="navTo('perfil',this);closeSidebar()">
    <span class="bnav-icon ni-icon"></span>
    <span class="bnav-label">Perfil</span>
  </div>
  <div class="bnav-item" id="bn-escritorio" onclick="navTo('escritorio',this);closeSidebar()">
    <span class="bnav-icon ni-icon"></span>
    <span class="bnav-label">Escrit.</span>
  </div>
  <div class="bnav-item" id="bn-vagas" onclick="navTo('vagas',this);closeSidebar()">
    <span class="bnav-icon ni-icon"></span>
    <span class="bnav-label">Vagas</span>
  </div>
  <div class="bnav-item" id="bn-habilidades" onclick="navTo('habilidades',this);closeSidebar()">
    <span class="bnav-icon ni-icon"></span>
    <span class="bnav-label">Skills</span>
  </div>
  <div class="bnav-item" id="bn-mais" onclick="toggleSidebar()">
    <span class="bnav-icon ni-icon"></span>
    <span class="bnav-label">Mais</span>
  </div>
</nav>

<!-- ════════ BARRA DE ENERGIA MOBILE ════════ -->
<div class="bloco-energia-mobile" id="barra-energia-mobile">
  <div class="bem-mobile-energia">
    <div class="bem-mobile-label" id="bem-mobile-label"></div>
    <div class="bem-mobile-bar">
      <div class="bem-mobile-bar-fill" id="bem-fill" style="width:100%;background:#4AAB77"></div>
    </div>
  </div>
  <span class="bem-mobile-val" id="bem-val">100/100</span>
  <button class="btn-avancar-mobile" id="btn-avancar-mobile" onclick="window.avancarMes()">
    ▶ Avançar
  </button>
</div>

<!-- ════════ MODAL GENÉRICO ════════ -->
<div class="modal-overlay" id="modal" onclick="fecharModal(event)">
  <div class="modal" id="modal-box">
    <div class="modal-header">
      <div class="modal-titulo" id="modal-titulo">—</div>
      <button class="modal-fechar" onclick="fecharModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer" style="display:none"></div>
  </div>
</div>

<!-- ════════ TOAST CONTAINER ════════ -->
<div id="toast-container"></div>

<!-- ════════ SCRIPTS ════════ -->
<script type="module">
  import './js/firebase-init.js';
  import './js/avancar_mes.js';
  import './js/escritorios_npc.js';
  import './js/equipe.js';
  import './js/relacionamento_dados.js';
  import './js/relacionamento.js';
  import './js/servicos_dados.js';
  import './js/servicos.js';
  import './js/escritorio_financas.js';
  import './js/assembleia_socios.js';
  import './js/posts_sociais.js';
  import './js/posgraduacao_ui.js';
  import './js/artigos_livros_ui.js';
  import './js/sistemas_sociais_ui.js';
  import './js/imprensa_ui.js';
  import './js/escritorio_painel.js';
  import './js/processos_escritorio.js';
  import './js/vagas.js';
  import './js/auth.js';
  import './js/gamestate.js';
  import './js/ui-main.js';
  import './js/banco_pecas.js';
  import './js/banco_questoes.js';
  import './js/banco_vademecum.js';
  import './js/processos.js';
  import './js/investigacao.js';
  import './js/peticoes_ui.js';
  import './js/patrimonio.js';
  import './js/financeiro_avancado.js';
  import './js/carreira.js';
  import './js/ranking.js';
  import './js/podcasts_ui.js';
</script>

<script>
// ── Tema claro/escuro ──
function _temaAtual() { return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark'; }
function _atualizarBotaoTema() {
  const btn = document.getElementById('btn-tema');
  if (!btn) return;
  const claro = _temaAtual() === 'light';
  btn.textContent = claro ? '☀️' : '🌙';
  btn.title = claro ? 'Mudar para tema escuro' : 'Mudar para tema claro';
}
window._alternarTema = function() {
  const novo = _temaAtual() === 'light' ? 'dark' : 'light';
  if (novo === 'light') document.documentElement.setAttribute('data-theme', 'light');
  else document.documentElement.removeAttribute('data-theme');
  try { localStorage.setItem('advocatus-tema', novo); } catch(e) {}
  _atualizarBotaoTema();
};
_atualizarBotaoTema();

// ── Avançar Mês (definido aqui para garantir disponibilidade antes dos módulos) ──
window.avancarMes = async function(forcar) {
  const j = window.JOGADOR;
  if (!j) { window.toast && window.toast('Carregando... tente novamente.', 'ko'); return; }

  const usado      = j.energia_usada_mes || 0;
  const disponivel = Math.max(0, (window.getEnergiaTotal ? window.getEnergiaTotal(j) : 100) - usado);
  // Sem bloqueio — o jogador pode avançar quando quiser
  // O botão fica em destaque quando disponivel <= 5 (energia quase esgotada)

  const tickEl = document.getElementById('server-tick');
  if (tickEl) tickEl.innerHTML = '⏳ Avançando...';

  // Aguardar FB_FUNCTIONS (inicializado pelo módulo firebase-init.js)
  let tentativas = 0;
  while (!window.FB_FUNCTIONS && tentativas < 30) {
    await new Promise(r => setTimeout(r, 300));
    tentativas++;
  }

  try {
    // Usar o SDK do Firebase para chamada autenticada (onCall)
    const fbFuncs = window.FB_FUNCTIONS;
    if (!fbFuncs) throw new Error('Firebase Functions não inicializado. Recarregue a página.');

    const { httpsCallable } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js');
    const fn     = httpsCallable(fbFuncs, 'avancarMes');
    const result = await fn({});
    const r      = result.data;
    if (r.ok) {
      window.toast && window.toast('✅ ' + r.mes + ' iniciado!', 'ok', 4000);
      if (tickEl) tickEl.innerHTML = '<span style="color:var(--ouro)">⚡ 100 energia</span>';
    }
  } catch(err) {
    const code = err.code || '';
    const msg  = (err.message || err.details || '').replace('Firebase: ','').replace(/\s*\(.*\)\s*$/,'');
    console.error('[AVANÇAR MÊS] code:', code, 'msg:', msg, err);

    if (tickEl) tickEl.innerHTML = '<span style="cursor:pointer;color:var(--ouro)" onclick="window.avancarMes()">▶ Avançar mês</span>';

    if (code === 'functions/failed-precondition' || msg.includes('energia') || msg.includes('Voce')) {
      window.toast ? window.toast('⚡ ' + msg, 'ko', 5000) : alert(msg);
    } else if (code === 'functions/resource-exhausted' || msg.includes('erias') || msg.includes('Descanse')) {
      window.toast ? window.toast('🏖️ ' + msg, 'ko', 8000) : alert(msg);
    } else if (code === 'functions/unauthenticated') {
      window.toast ? window.toast('🔒 Sessão expirada. Recarregue a página.', 'ko') : alert('Sessão expirada.');
    } else {
      window.toast ? window.toast('Erro: ' + msg.slice(0,100), 'ko') : alert(msg);
    }
  }
};

// ── Navegação entre painéis (com hash URL) ──
window.navTo = function(painel, el) {
  // Atualizar nav lateral
  document.querySelectorAll('.nav-item').forEach(a => a.classList.remove('ativo'));

  if (el) {
    el.classList.add('ativo');
    const match = document.querySelector(`.nav-item[onclick*="${painel}"]`);
    if (match) match.classList.add('ativo');
  } else {
    const match = document.querySelector(`.nav-item[onclick*="${painel}"]`);
    if (match) match.classList.add('ativo');
  }

  // Atualizar aba superior (nav-top) — antes só adicionava .ativo na aba
  // clicada e nunca limpava as anteriores, então toda aba já visitada
  // (Escritório, Ranking, Social, Loja) ficava dourada para sempre. Mapeia
  // o painel atual (que pode ser um sub-painel sem link próprio no topo,
  // ex. "balancete"/"habilidades") para a aba do topo a que pertence.
  const ESC_PAINEIS_TOP = new Set(['escritorio','processos','balancete','equipe','clientes','repertorio','midia_convites']);
  const abaTop = ESC_PAINEIS_TOP.has(painel) ? 'escritorio'
    : (painel === 'ranking' || painel === 'vagas' || painel === 'loja') ? painel
    : 'perfil';
  document.querySelectorAll('.nav-top a').forEach(a => a.classList.remove('ativo'));
  const matchTop = document.querySelector(`.nav-top a[onclick*="'${abaTop}'"]`);
  if (matchTop) matchTop.classList.add('ativo');

  // Atualizar hash sem disparar hashchange novamente
  if (location.hash !== '#' + painel) {
    history.pushState({ painel }, '', '#' + painel);
  }

  // Disparar evento para ui-main.js renderizar o painel
  window.dispatchEvent(new CustomEvent('nav:painel', { detail: painel }));
};

// ── Restaurar painel ao navegar com botão voltar/avançar ──
window.addEventListener('popstate', (e) => {
  const painel = (e.state && e.state.painel) || location.hash.replace('#','') || 'perfil';
  window.navTo(painel, null);
});

// ── Acessibilidade: torna elementos com onclick (nav-item, bnav-item, etc.) navegáveis por teclado ──
function habilitarFocoTeclado(escopo) {
  (escopo || document).querySelectorAll('[onclick]').forEach(el => {
    if (['BUTTON','A','INPUT','SELECT','TEXTAREA'].includes(el.tagName)) return;
    if (el.hasAttribute('tabindex')) return;
    el.setAttribute('tabindex', '0');
    if (!el.hasAttribute('role')) el.setAttribute('role', 'button');
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); el.click(); }
    });
  });
}

// ── Restaurar painel ao carregar/dar F5 ──
window.addEventListener('DOMContentLoaded', () => {
  habilitarFocoTeclado();
  const painelInicial = location.hash.replace('#','') || 'perfil';
  if (painelInicial !== 'perfil') {
    // Espera o gamestate estar pronto antes de navegar
    window.addEventListener('gamestate:ready', function _onReady() {
      window.removeEventListener('gamestate:ready', _onReady);
      window.navTo(painelInicial, null);
    }, { once: true });
  }
});

// ── Modal ──
window.abrirModal = function(titulo, corpo, footer) {
  document.getElementById('modal-titulo').textContent = titulo;
  document.getElementById('modal-body').innerHTML     = corpo || '';
  const ft = document.getElementById('modal-footer');
  if (footer) {
    ft.innerHTML      = footer;
    ft.style.display  = 'flex';
  } else {
    ft.style.display  = 'none';
  }
  document.getElementById('modal').classList.add('vis');
};
window.fecharModal = function(e) {
  if (e && e.target !== document.getElementById('modal')) return;
  document.getElementById('modal').classList.remove('vis');
};

// ── Toast ──
window.toast = function(msg, tipo = 'neutro', duracao = 3500) {
  const container = document.getElementById('toast-container');
  const el        = document.createElement('div');
  el.className    = `toast ${tipo}`;
  el.textContent  = msg;
  container.appendChild(el);
  setTimeout(() => {
    el.style.animation = 'fadeOut .3s ease forwards';
    setTimeout(() => el.remove(), 300);
  }, duracao);
};

// ── Formato de moeda ──
// ── Mobile sidebar ──
window.toggleSidebar = function() {
  const sb  = document.querySelector('.sidebar-left');
  const ov  = document.getElementById('sidebar-overlay');
  const hb  = document.getElementById('hamburger');
  const isOpen = sb.classList.contains('aberta');
  if (isOpen) {
    sb.classList.remove('aberta');
    ov.classList.remove('vis');
    hb.classList.remove('aberto');
    document.body.style.overflow = '';
  } else {
    sb.classList.add('aberta');
    ov.classList.add('vis');
    hb.classList.add('aberto');
    document.body.style.overflow = 'hidden';
  }
};
window.closeSidebar = function() {
  const sb = document.querySelector('.sidebar-left');
  const ov = document.getElementById('sidebar-overlay');
  const hb = document.getElementById('hamburger');
  sb.classList.remove('aberta');
  ov.classList.remove('vis');
  hb.classList.remove('aberto');
  document.body.style.overflow = '';
};

// ── Atualizar bottom nav ativo ──
const _navToOrig = window.navTo;
window.navTo = function(painel, el) {
  _navToOrig(painel, el);
  // Atualizar bottom nav
  document.querySelectorAll('.bnav-item').forEach(b => b.classList.remove('ativo'));
  const bnMap = { perfil:'bn-perfil', processos:'bn-processos', escritorio:'bn-escritorio', vagas:'bn-vagas', habilidades:'bn-habilidades' };
  if (bnMap[painel]) document.getElementById(bnMap[painel])?.classList.add('ativo');
  closeSidebar();
};

// ── Atualizar topbar + barra mobile ──
window.addEventListener('jogador:update', (e) => {
  const j    = e.detail;
  if (!j) return;
  const usado = j.energia_usada_mes || 0;
  const disp  = Math.max(0, (window.getEnergiaTotal ? window.getEnergiaTotal(j) : 100) - usado);
  const cor   = disp > 50 ? '#4AAB77' : disp > 20 ? '#B7791F' : '#C0392B';

  // ── Barra de energia mobile ──
  const fill = document.getElementById('bem-fill');
  const val  = document.getElementById('bem-val');
  const btn  = document.getElementById('btn-avancar-mobile');
  if (fill) { fill.style.width = disp + '%'; fill.style.background = cor; }
  if (val)  val.textContent = disp + '/100';
  if (btn)  { btn.textContent = '▶ Avançar'; btn.classList.add('pronto'); }
});

window.fmt = function(n) {
  if (!n && n !== 0) return '—';
  if (n >= 1000000) return `R$ ${(n/1000000).toFixed(1)}M`;
  if (n >= 1000)    return `R$ ${Math.round(n/1000)}k`;
  return `R$ ${Number(n).toLocaleString('pt-BR')}`;
};
window.fmtFull = function(n) {
  return `R$ ${Number(n || 0).toLocaleString('pt-BR', {minimumFractionDigits:2})}`;
};
</script>

</body>
